<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slick Dash - Custom New Tab</title>
  <!-- Content Security Policy to block the Netlify badge if it ever returns -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self';">
  <style>
    :root {
      --bg-color: #f9fafb;
      --text-main: #111827;
      --text-muted: #4b5563;
      --btn-chrome: #2563eb;
      --btn-firefox: #ea580c;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.25rem;
      color: var(--text-muted);
      max-width: 600px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    a.button {
      text-decoration: none;
      color: white;
      padding: 0.875rem 1.75rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: opacity 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    a.button:hover { opacity: 0.9; }
    a.button:active { transform: scale(0.98); }
    .chrome { background-color: var(--btn-chrome); }
    .firefox { background-color: var(--btn-firefox); }
  </style>
</head>
<body>

  <h1>Slick Dash</h1>
  <p>A cleaner, faster, and fully customizable new tab experience. Strip away the clutter and focus on what matters.</p>

  <div class="buttons">
    <a href="https://chromewebstore.google.com/detail/slick-dash/bffgnckkngmebclpdjniofhenlnommkk" class="button chrome">
      Get for Chrome
    </a>
    <a href="https://addons.mozilla.org/en-US/firefox/addon/slick-dash/" class="button firefox">
      Get for Firefox
    </a>
  </div>

</body>
</html>
